<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeydoo Link Cleaner & FB Formatter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: radial-gradient(circle at top, #1e1b4b, #090d16);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(148, 163, 184, 0.2);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 28px 24px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .badge {
            background: #3b82f6;
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        h1 {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
        }
        p.sub {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 22px;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #cbd5e1;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-group {
            margin-bottom: 18px;
        }
        input[type="text"], select {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1.5px solid rgba(148, 163, 184, 0.3);
            color: #ffffff;
            padding: 13px 14px;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, select:focus {
            border-color: #3b82f6;
        }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }
        .btn-generate {
            width: 100%;
            background: linear-gradient(90deg, #3b82f6, #2563eb);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
            margin-bottom: 22px;
        }
        .btn-generate:hover {
            transform: translateY(-2px);
        }
        .output-box {
            background: rgba(15, 23, 42, 0.9);
            border: 1.5px dashed rgba(34, 197, 94, 0.5);
            border-radius: 14px;
            padding: 16px;
            display: none;
        }
        .output-label {
            font-size: 11px;
            color: #4ade80;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 6px;
            display: block;
        }
        .clean-url {
            word-break: break-all;
            font-family: monospace;
            font-size: 14px;
            color: #fde047;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .btn-copy {
            width: 100%;
            background: linear-gradient(90deg, #22c55e, #16a34a);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-copy:hover {
            background: #15803d;
        }
        .error-msg {
            color: #f87171;
            font-size: 13px;
            margin-bottom: 14px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <span class="badge">CPA Utility Tool</span>
        </div>
        <h1>Zeydoo Facebook Link Formatter</h1>
        <p class="sub">Paste any Zeydoo offer or SmartLink URL to strip macros and format it cleanly for Facebook traffic.</p>

        <div class="input-group">
            <label for="rawUrl">Paste Raw Zeydoo Link</label>
            <input type="text" id="rawUrl" placeholder="https://nya5.com/link?z=12270908&var={SOURCE_ID}&ymid={CLICK_ID}">
        </div>

        <div class="row">
            <div>
                <label for="sourceSelect">Traffic Source Tag</label>
                <select id="sourceSelect" onchange="toggleCustomTag()">
                    <option value="facebook">facebook (Default)</option>
                    <option value="fb_reels">fb_reels</option>
                    <option value="fb_group">fb_group</option>
                    <option value="tiktok">tiktok</option>
                    <option value="custom">Custom Tag...</option>
                </select>
            </div>
            <div id="customTagBox" style="display: none;">
                <label for="customTag">Custom Tag Name</label>
                <input type="text" id="customTag" placeholder="e.g. fb_post1">
            </div>
        </div>

        <div class="error-msg" id="errorMsg">Please paste a valid Zeydoo URL first!</div>

        <button class="btn-generate" onclick="formatLink()">⚡ Format Link for Facebook</button>

        <div class="output-box" id="outputBox">
            <span class="output-label">✅ Ready-to-Use Clean Link:</span>
            <div class="clean-url" id="cleanUrlText"></div>
            <button class="btn-copy" id="copyBtn" onclick="copyCleanUrl()">📋 Copy Clean Link</button>
        </div>
    </div>

    <script>
        function toggleCustomTag() {
            const select = document.getElementById('sourceSelect').value;
            document.getElementById('customTagBox').style.display = (select === 'custom') ? 'block' : 'none';
        }

        function formatLink() {
            const rawInput = document.getElementById('rawUrl').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const outputBox = document.getElementById('outputBox');
            const cleanUrlText = document.getElementById('cleanUrlText');

            if (!rawInput || !rawInput.startsWith('http')) {
                errorMsg.style.display = 'block';
                outputBox.style.display = 'none';
                return;
            }
            errorMsg.style.display = 'none';

            // Determine selected tag
            let tag = document.getElementById('sourceSelect').value;
            if (tag === 'custom') {
                const customVal = document.getElementById('customTag').value.trim().replace(/\s+/g, '_');
                tag = customVal || 'facebook';
            }

            try {
                const urlObj = new URL(rawInput);
                const zParam = urlObj.searchParams.get('z');

                let formatted = '';
                if (zParam) {
                    // Clean Zeydoo structure keeping origin, pathname, z, and clean var
                    formatted = `${urlObj.origin}${urlObj.pathname}?z=${zParam}&var=${encodeURIComponent(tag)}`;
                } else {
                    // Fallback regex cleanup if URL format differs
                    formatted = rawInput
                        .replace(/&ymid=\{CLICK_ID\}/gi, '')
                        .replace(/ymid=\{CLICK_ID\}&?/gi, '')
                        .replace(/\{SOURCE_ID\}/gi, encodeURIComponent(tag));
                }

                cleanUrlText.textContent = formatted;
                outputBox.style.display = 'block';
                document.getElementById('copyBtn').textContent = '📋 Copy Clean Link';
            } catch (e) {
                errorMsg.textContent = 'Invalid URL format. Please check your link.';
                errorMsg.style.display = 'block';
            }
        }

        function copyCleanUrl() {
            const text = document.getElementById('cleanUrlText').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.textContent = '✅ Copied to Clipboard!';
                setTimeout(() => {
                    btn.textContent = '📋 Copy Clean Link';
                }, 2000);
            });
        }
    </script>

</body>
</html>
